# Mirrors ./test.sh, minus the sections that need the sources.
#
# The 262 MB Wookieepedia dump is deliberately NOT fetched here. CI's job is to
# prove the code is sound and, above all, that no fetched or generated data has
# been committed -- the data-boundary step below is the mechanical enforcement
# of this repository's whole licensing position, and it is the one step that
# must never be allowed to become advisory.
#
# The corpus contracts (tests/test_schema.py) and the invariants skip here for
# want of data; they run locally, where the cache exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: pip install ruff black mypy

      # --- the guard that matters -------------------------------------------
      # Upstream is CC BY-SA (Wookieepedia). This repository publishes the code
      # that reads it, never the text. Nothing under data/raw/ or data/derived/
      # may ever be tracked.
      - name: Data boundary
        run: |
          leaked=$(git ls-files | grep -E '^data/(raw|derived)/' || true)
          if [ -n "$leaked" ]; then
            echo "::error::fetched or generated data is tracked:"
            echo "$leaked"
            exit 1
          fi
          bulk=$(git ls-files \
            | grep -E '\.(7z|xml|jsonl|sqlite3?|db)$' \
            | grep -v '^data/curated/' || true)
          if [ -n "$bulk" ]; then
            echo "::error::bulk data formats are tracked:"
            echo "$bulk"
            exit 1
          fi
          # `if`, not `&&`: this workflow's shell is `bash -e`, and a trailing
          # `&&` chain that ends false makes the whole assignment exit 1 --
          # which fails the step with no message whenever the LAST tracked file
          # happens to be under the limit. Found by CI; the local runner uses
          # `set -uo pipefail` without -e and never saw it.
          big=$(git ls-files | while read -r f; do
                  if [ -f "$f" ] && [ "$(wc -c <"$f")" -gt 1000000 ]; then
                    echo "$f"
                  fi
                done)
          if [ -n "$big" ]; then
            echo "::error::tracked files over 1 MB:"
            echo "$big"
            exit 1
          fi

      - name: Check for tracked secrets files
        run: |
          FORBIDDEN_FILES=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -Ev '\.env\.(template|example)$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Env files with real credentials should never be committed to git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

      # --- quality -----------------------------------------------------------
      - name: Lint
        run: ruff check scripts tests

      - name: Format
        run: black --check scripts tests

      - name: Types
        run: mypy --ignore-missing-imports scripts

      - name: Tests
        # Sections needing the 262 MB dump skip themselves; --fast makes that
        # explicit rather than incidental.
        run: ./test.sh --fast
